function dash(){const v=$('#per').value;let ix=[...Array(12).keys()];if(v[0]=='q'){const q=+v[1];ix=[q*3,q*3+1,q*3+2]}else if(v[0]=='m')ix=[+v.slice(1)];
 const g=k=>ix.map(i=>D[k][i]),sm=a=>a.reduce((x,y)=>x+y,0),ex=ix.map(i=>D.opx[i]+D.oth[i]),lb=ix.map(i=>L(MN[i]));
 const rev=sm(g('rev')),te=sm(ex),np=rev-te,mg=rev?np/rev*100:0;
 const K=[[L('Pendapatan|Revenue'),rev,n=>'Rp '+fm(n)+' jt'],[L('Beban Operasional|Operating Expenses'),te,n=>'Rp '+fm(n)+' jt'],[L('Laba Bersih|Net Profit'),np,n=>'Rp '+fm(n)+' jt'],[L('Margin Laba|Profit Margin'),mg,n=>n.toFixed(1)+'%']];
 if(!$('#kp').children.length||$('#kp').dataset.l!==lang){$('#kp').dataset.l=lang;$('#kp').innerHTML=K.map(k=>`<div class="gl k"><span>${k[0]}</span><b></b></div>`).join('')}
 K.forEach((k,i)=>cnt($('#kp').children[i].querySelector('b'),k[1],k[2]));

 mk('#c2','line',{labels:lb,datasets:[{label:L('Aktual|Actual'),data:g('rev'),borderColor:'#438BFF',backgroundColor:'rgba(67,139,255,.15)',fill:true,tension:.35},{label:L('Target|Budget'),data:g('bR'),borderColor:'#D6B36A',borderDash:[6,4],tension:.35,pointRadius:0}]});
 mk('#c3','doughnut',{labels:XC.map(x=>L(x[0])),datasets:[{data:XC.map(x=>Math.round(te*x[1])),backgroundColor:PAL,borderColor:'#111C30',borderWidth:3}]},{cutout:'62%'});
 mk('#c4','bar',{labels:lb,datasets:[{label:L('Kas Masuk|Inflow'),data:g('inf'),backgroundColor:'rgba(67,139,255,.75)',borderRadius:5},{label:L('Kas Keluar|Outflow'),data:g('out'),backgroundColor:'rgba(154,166,181,.5)',borderRadius:5},{type:'line',label:L('Arus Kas Bersih|Net Cash Flow'),data:ix.map(i=>D.inf[i]-D.out[i]),borderColor:'#D6B36A',backgroundColor:'#D6B36A',tension:.35}]});

/* ---- Business Health Check ---- */
const HF=[['rev','Pendapatan Bulanan (Rp)|Monthly Revenue (IDR)',500000000],['opx','Beban Operasional (Rp)|Operating Expenses (IDR)',280000000],['oth','Beban Lain-lain (Rp)|Other Expenses (IDR)',40000000],['beg','Saldo Kas Awal (Rp)|Initial Cash Balance (IDR)',150000000],['inf','Kas Masuk (Rp)|Cash Inflow (IDR)',470000000],['out','Kas Keluar (Rp)|Cash Outflow (IDR)',400000000]];
function calc(v){const te=v.opx+v.oth,np=v.rev-te,ncf=v.inf-v.out;return{te,np,mg:v.rev?np/v.rev*100:0,er:v.rev?te/v.rev*100:0,ncf,end:v.beg+ncf}}
function hform(keep){const cur={};HF.forEach(f=>{const e=$('#h-'+f[0]);cur[f[0]]=e&&keep?e.value:f[2]});
 $('#fm').innerHTML=HF.map(f=>`<label>${L(f[1])}<input id="h-${f[0]}" type="number" min="0" step="any" inputmode="decimal" value="${cur[f[0]]}"></label>`).join('')+`<button class="btn s o" id="hr">${L('Atur Ulang|Reset')}</button>`;
 $$('#fm input').forEach(e=>e.addEventListener('input',hc));$('#hr').onclick=()=>{hform(false);hc()}}
function hc(){const v={};HF.forEach(f=>{v[f[0]]=Math.max(0,parseFloat($('#h-'+f[0]).value)||0)});const r=calc(v),R=n=>(n<0?'-':'')+'Rp '+fm(Math.abs(n));
 const K=[[L('Total Beban|Total Expenses'),R(r.te)],[L('Laba Bersih|Net Profit'),R(r.np)],[L('Margin Laba|Profit Margin'),r.mg.toFixed(1)+'%'],[L('Rasio Beban|Expense Ratio'),r.er.toFixed(1)+'%'],[L('Arus Kas Bersih|Net Cash Flow'),R(r.ncf)],[L('Saldo Kas Akhir|Ending Cash'),R(r.end)]];
 $('#hk').innerHTML=K.map(k=>`<div class="gl k"><span>${k[0]}</span><b style="font-size:21px">${k[1]}</b></div>`).join('');
 const S=r.np<0?['Rugi|Loss','#ef5b5b']:r.mg<10?['Margin Tipis|Thin Margin','#e8a33d']:r.mg<20?['Sehat|Healthy','#438BFF']:['Sangat Kuat|Very Strong','#3ddc97'];
 const hs=$('#hs');hs.textContent=L('Status profitabilitas: |Profitability status: ')+L(S[0]);hs.style.cssText=`background:${S[1]}22;color:${S[1]};border:1px solid ${S[1]}66`;
 const ob=[],rc=[];
 if(!v.rev)ob.push('Pendapatan belum diisi, sehingga margin tidak dapat dihitung.|Revenue is empty, so margins cannot be calculated.');
 else if(r.np<0)ob.push('Beban melebihi pendapatan, bisnis berada dalam posisi rugi.|Expenses exceed revenue; the business is running at a loss.');
 else ob.push('Margin laba bersih sebesar '+r.mg.toFixed(1)+'%.|Net profit margin is '+r.mg.toFixed(1)+'%.');
 if(v.rev&&r.er>85)ob.push('Rasio beban tinggi ('+r.er.toFixed(1)+'%), ruang laba sempit.|Expense ratio is high ('+r.er.toFixed(1)+'%), leaving thin profit room.');
 if(r.ncf<0)ob.push('Arus kas bersih negatif, kas berkurang Rp '+fm(-r.ncf)+'.|Net cash flow is negative; cash decreased by IDR '+fm(-r.ncf)+'.');
 if(r.end<0)ob.push('Saldo kas akhir negatif, ada risiko likuiditas.|Ending cash is negative, indicating liquidity risk.');
 if(r.np>0&&r.ncf<0)ob.push('Laba positif tetapi kas turun; periksa piutang dan persediaan.|Profit is positive but cash is falling; check receivables and inventory.');
 if(r.er>80||r.np<0)rc.push('Telaah komponen beban terbesar dan cari peluang efisiensi.|Review the largest expense components and look for efficiencies.');
 if(r.ncf<0)rc.push('Percepat penagihan, atur jadwal pembayaran, dan siapkan cadangan kas.|Speed up collections, re-time payments, and build a cash reserve.');
 if(r.mg>=20&&r.ncf>=0)rc.push('Pertahankan disiplin biaya dan pertimbangkan alokasi kas untuk pertumbuhan.|Maintain cost discipline and consider allocating cash for growth.');
 rc.push('Pantau indikator ini tiap bulan dan bandingkan dengan anggaran.|Track these indicators monthly and compare them against budget.');
 $('#ho').innerHTML=`<ul>${ob.map(x=>`<li>${L(x)}</li>`).join('')}</ul><p style="margin-top:14px;font-weight:700;font-size:13px;color:var(--gold)">${L('Rekomendasi umum|General recommendations')}</p><ul>${rc.map(x=>`<li>${L(x)}</li>`).join('')}</ul>`;
 mk('#h1','bar',{labels:[L('Pendapatan|Revenue'),L('Total Beban|Total Expenses'),L('Laba Bersih|Net Profit')],datasets:[{data:[v.rev,r.te,r.np],backgroundColor:['rgba(67,139,255,.75)','rgba(154,166,181,.5)',r.np<0?'#ef5b5b':'#D6B36A'],borderRadius:6}]},{plugins:{legend:{display:false}}});
 mk('#h2','bar',{labels:[L('Kas Awal|Begin'),L('Masuk|Inflow'),L('Keluar|Outflow'),L('Kas Akhir|Ending')],datasets:[{data:[v.beg,v.inf,v.out,r.end],backgroundColor:['rgba(154,166,181,.5)','rgba(67,139,255,.75)','rgba(154,166,181,.5)',r.end<0?'#ef5b5b':'#D6B36A'],borderRadius:6}]},{plugins:{legend:{display:false}}});
}
